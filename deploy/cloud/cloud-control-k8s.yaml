apiVersion: v1
kind: Service
metadata:
  name: uav-cloud-api
  namespace: uav
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: uav-cloud-api
  ports:
  - name: http
    port: 38443
    targetPort: 38443
    nodePort: 32443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uav-cloud-api
  namespace: uav
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: uav-cloud-api
  template:
    metadata:
      labels:
        app: uav-cloud-api
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: compute1
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: api
        image: RENDER_REQUIRED_CLOUD_API
        imagePullPolicy: Never
        command:
        - python
        - -m
        - cloud.cloud_api.api
        env:
        - name: UAV_CLOUD_CONFIG
          value: /config/api.json
        ports:
        - name: http
          containerPort: 38443
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: identity
          mountPath: /keys
          readOnly: true
        - name: api-state
          mountPath: /state
      volumes:
      - name: config
        configMap:
          name: uav-cloud-control-config
          items:
          - key: api.json
            path: api.json
      - name: identity
        secret:
          secretName: uav-cloud-identity
          defaultMode: 288
          items:
          - key: service.token
            path: service.token
      - name: api-state
        hostPath:
          path: /home/ubuntu/uav-cloud-control/state/api
          type: Directory
